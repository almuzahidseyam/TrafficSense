name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application
        run: dotnet build src/TrafficSense.csproj -c Release
      - name: Validate release version and changelog
        shell: pwsh
        run: ./scripts/Prepare-Release.ps1
      - name: Run regression tests
        run: dotnet test tests/TrafficSense.Tests/TrafficSense.Tests.csproj -c Release
      - name: Build and verify portable ZIP and Windows lifecycle
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/Build-Portable.ps1
      - name: Build and verify Lite ZIP with shared .NET runtime
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -Lite
      - name: Build and verify per-user installer
        timeout-minutes: 10
        shell: pwsh
        run: |
          $source = (Get-ChildItem '.artifacts/portable/*/app/TrafficSense.exe' | Select-Object -First 1).DirectoryName
          ./scripts/Build-Installer.ps1 -SourceDirectory $source -VerifyInstall
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSense-win-x64
          path: |
            .artifacts/portable/**/TrafficSense.zip
            .artifacts/portable/**/TrafficSense.zip.sha256
            .artifacts/lite/**/TrafficSense-Lite-win-x64.zip
            .artifacts/lite/**/TrafficSense-Lite-win-x64.zip.sha256
            .artifacts/installer/**/TrafficSense-Setup.exe
            .artifacts/installer/**/TrafficSense-Setup.exe.sha256
          include-hidden-files: true
          if-no-files-found: error
      - name: Check visible and hidden monitoring resource stability
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/Test-Stability.ps1 -Seconds 60 -StressIterations 1500
      - name: Upload stability measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrafficSense-stability
          path: .artifacts/stability/**/stability.json
          include-hidden-files: true
          if-no-files-found: warn
