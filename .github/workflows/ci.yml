name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application
        run: dotnet build src/TrafficSense.csproj -c Release
      - name: Run regression tests
        run: dotnet test tests/TrafficSense.Tests/TrafficSense.Tests.csproj -c Release
      - name: Verify Windows tray and process lifecycle
        timeout-minutes: 2
        run: dotnet run --project tests/TrafficSense.LifecycleTests/TrafficSense.LifecycleTests.csproj -c Release
