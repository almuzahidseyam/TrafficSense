name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v*, i.e. v1.0.0

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/NetMeter.csproj

    - name: Build and Publish
      run: dotnet publish src/NetMeter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Zip Release
      run: Compress-Archive -Path ./publish/* -DestinationPath NetMeter.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: NetMeter.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
