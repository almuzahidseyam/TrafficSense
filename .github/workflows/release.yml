name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v*, i.e. v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Validate tag and prepare release notes
      shell: pwsh
      run: ./scripts/Prepare-Release.ps1 -Tag $env:GITHUB_REF_NAME

    - name: Run regression tests
      run: dotnet test tests/TrafficSense.Tests/TrafficSense.Tests.csproj -c Release

    - name: Build and verify portable ZIP and Windows lifecycle
      timeout-minutes: 10
      shell: pwsh
      run: ./scripts/Build-Portable.ps1

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: .artifacts/release-notes.md
        fail_on_unmatched_files: true
        files: |
          .artifacts/portable/**/TrafficSense.zip
          .artifacts/portable/**/TrafficSense.zip.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
